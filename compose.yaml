services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: notes
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 1s
      timeout: 5s
      retries: 10
  mailtrap:
    image: mailtrap/mailtrap-local:0.4.1
    ports:
      - '127.0.0.1:3550:3550'
    volumes:
      - mailtrap-data:/var/lib/mailtrap-local
volumes:
  postgres-data:
  mailtrap-data:
